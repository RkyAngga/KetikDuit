rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.activity') {
                details.useVersion '1.8.1'
            }
            if (details.requested.group == 'androidx.lifecycle') {
                details.useVersion '2.7.0'
            }
            if (details.requested.group == 'androidx.core') {
                details.useVersion '1.13.1'
            }
            if (details.requested.group == 'androidx.fragment') {
                details.useVersion '1.7.1'
            }
            if (details.requested.group == 'androidx.window') {
                details.useVersion '1.2.0'
            }
            if (details.requested.group == 'androidx.annotation') {
                details.useVersion '1.7.0'
            }
            if (details.requested.group == 'androidx.annotation' && details.requested.name == 'annotation-experimental') {
                details.useVersion '1.4.1'
            }
            if (details.requested.group == 'androidx.exifinterface') {
                details.useVersion '1.4.1'
            }
        }
    }
}

// Memaksa compileSdkVersion 36 untuk SEMUA modul tanpa afterEvaluate untuk menghindari error evaluasi siklik
subprojects {
    project.plugins.withType(com.android.build.gradle.BasePlugin.class) {
        project.android {
            compileSdkVersion 36
            buildToolsVersion "34.0.0"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
